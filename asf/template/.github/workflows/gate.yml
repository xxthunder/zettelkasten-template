name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The Windows runner converts line endings by default; the bash scripts need LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: bash asf/scripts/gate
        shell: bash
