[project]
name = "asf"
version = "0.0.0"
requires-python = ">=3.11"
description = "Test harness for the scripts of the Agentic Software Forge template. The scripts themselves need only python3 and its standard library."

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
